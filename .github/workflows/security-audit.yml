 name: Security Audit

  "on":
    push:
      branches: [main]
    schedule:
      - cron: '0 11 * * 1'

  jobs:
    audit:
      name: npm audit
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Bun
          uses: oven-sh/setup-bun@v2

        - name: Install dependencies
          run: bun install

        - name: Run security audit
          run: bun audit
